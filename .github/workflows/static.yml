# Deploy static content to Pages (main + test-improvements)
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "test-improvements"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout test-improvements
        uses: actions/checkout@v4
        with:
          ref: test-improvements
          path: test
        continue-on-error: true

      - name: Generate config.js from secrets (main)
        working-directory: main
        run: |
          cat > config.js << 'EOF'
          window.TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}';
          window.TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}';
          EOF

      - name: Generate config.js from secrets (test)
        if: hashFiles('test/index.html') != ''
        working-directory: test
        run: |
          cat > config.js << 'EOF'
          window.TELEGRAM_BOT_TOKEN = '${{ secrets.TELEGRAM_BOT_TOKEN }}';
          window.TELEGRAM_CHAT_ID = '${{ secrets.TELEGRAM_CHAT_ID }}';
          EOF

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/* site/
          if [ -d "test" ] && [ -f "test/index.html" ]; then
            mkdir -p site/test
            cp -r test/* site/test/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
